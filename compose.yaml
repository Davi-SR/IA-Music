name: musicai
services:
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    env_file: [.env]
    environment:
      AUDIO_JOB_ROOT: /data/jobs
      MUSICAI_DATABASE_PATH: /data/musicai.db
      AUDIO_FRONTEND_DIR: /app/empty-frontend
      AUDIO_DEMUCS_EXECUTABLE: demucs
      TORCH_HOME: /model-cache/torch
      XDG_CACHE_HOME: /model-cache
    volumes:
      - musicai_data:/data
      - musicai_model_cache:/model-cache
    networks: [musicai]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["80:80"]
    networks: [musicai]
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
networks:
  musicai: {driver: bridge}
volumes:
  musicai_data:
  musicai_model_cache:
